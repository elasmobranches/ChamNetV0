# ZED ArUco Depth Estimation Configuration

# Marker configuration
marker_id: 30
marker_size_mm: 100
aruco_dict: DICT_4X4_50

# Experimental distances (meters)
target_distances: [0.5, 0.7, 1.0, 1.5, 2.0, 3.0]
measurements_per_distance: 50

# ZED camera settings
zed_settings:
  depth_mode: NEURAL_PLUS  # NEURAL_PLUS, NEURAL, ULTRA, QUALITY, PERFORMANCE
  resolution: HD1080        # HD2K, HD1080, HD720, VGA
  fps: 30
  depth_minimum_distance: 200      # mm
  depth_maximum_distance: 20000    # mm
  confidence_threshold: 0
  texture_confidence_threshold: 0
  enable_fill_mode: true
  depth_stabilization: 1

# Depth measurement settings
depth_measurement:
  use_marker_region: true   # true: 마커 영역 전체, false: 윈도우 방식
  window_size: 11
  min_valid_ratio: 0.5

# Web server settings
web_server:
  host: 0.0.0.0            # 모든 네트워크 인터페이스에서 접속 허용
  port: 5000               # 웹 서버 포트
  stream_quality: 85       # JPEG 품질 (1-100)
  stream_fps: 15           # 스트리밍 FPS

# File paths
paths:
  output_dir: data/results
  log_dir: logs
